name: TTX xADAS Rebuild - Lite and AI ARM64
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Guard against black SurfaceView
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("app/src/main/java/vn/thanhtaxixanh/camera/ai/MainActivity.kt").read_text()
          view=src.split("surfaceView = SurfaceView(this).apply",1)[1].split("val videoContainer = FrameLayout",1)[0]
          assert "setBackgroundColor(Color.BLACK)" not in view
          assert "background = null" in view
          assert "holder.setFormat(PixelFormat.OPAQUE)" in view
          print("SurfaceView transparency: OK")
          PY
      - name: Guard owner-confirmed camera pairing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path("app/src/main/java/vn/thanhtaxixanh/camera/ai/MainActivity.kt").read_text()
          p=Path("app/src/main/java/vn/thanhtaxixanh/camera/ai/A500sOwnerSession.kt").read_text()
          assert "setOnClickListener { pairA500s() }" in m
          assert "pairWithPhysicalConfirmation" in p
          assert "require(pairedToken.matches" in p
          assert "instanceFollowRedirects = false" in p
          print("Physical owner pairing: OK")
          PY
      - name: Unit test and build both variants
        run: >-
          gradle --no-daemon
          :app:testLiteDebugUnitTest
          :app:testAiDebugUnitTest
          :app:assembleLiteDebug
          :app:assembleAiDebug
          --stacktrace
      - name: Inspect APK sizes and native architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          ijk={"libijkplayer.so","libijkwdzffmpeg.so","libijksdl.so"}
          for flavor in ("lite","ai"):
              files=list(Path(f"app/build/outputs/apk/{flavor}/debug").glob("*.apk"))
              assert len(files)==1, (flavor,files)
              apk=files[0]
              with zipfile.ZipFile(apk) as z:
                  names=z.namelist()
                  libs=[p for p in names if p.endswith(".so")]
                  assert not any(p.lower().endswith((".onnx",".ncnn",".param")) for p in names), (
                      flavor,"no proprietary model weights may be bundled")
              found={p.rsplit("/",1)[-1] for p in libs}
              missing=ijk-found
              assert not missing, (flavor, missing)
              assert all(p.startswith("lib/arm64-v8a/") for p in libs), (flavor,libs)
              if flavor=="lite":
                  assert not any("onnxruntime" in p.lower() for p in libs), libs
              else:
                  assert any("onnxruntime" in p.lower() for p in libs), libs
              print(flavor.upper(),"APK_BYTES",apk.stat().st_size)
              print(flavor.upper(),"NATIVE",sorted(found))
          PY
      - name: Upload compact Lite ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TTX-CameraAI-Lite-ARM64
          path: app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
      - name: Upload ONNX AI ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TTX-CameraAI-AI-ARM64
          path: app/build/outputs/apk/ai/debug/*.apk
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
