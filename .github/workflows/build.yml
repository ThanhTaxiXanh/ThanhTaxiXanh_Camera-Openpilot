name: TTX xADAS Rebuild - Lite and AI ARM64
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Validate two-gate acceptance ledger
        run: |
          python3 tools/verify_two_gate.py
          python3 -m unittest discover -s tools -p 'test_two_gate.py' -v
      - name: Guard against black SurfaceView
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src=Path("app/src/main/java/vn/thanhtaxixanh/camera/ai/MainActivity.kt").read_text()
          view=src.split("surfaceView = SurfaceView(this).apply",1)[1].split("val videoContainer = FrameLayout",1)[0]
          assert "setBackgroundColor(Color.BLACK)" not in view
          assert "background = null" in view
          assert "holder.setFormat(PixelFormat.OPAQUE)" in view
          print("SurfaceView transparency: OK")
          PY
      - name: Guard owner-confirmed camera pairing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          m=Path("app/src/main/java/vn/thanhtaxixanh/camera/ai/MainActivity.kt").read_text()
          p=Path("app/src/main/java/vn/thanhtaxixanh/camera/ai/A500sOwnerSession.kt").read_text()
          assert "setOnClickListener { pairA500s() }" in m
          assert "pairWithPhysicalConfirmation" in p
          assert "require(pairedToken.matches" in p
          assert "instanceFollowRedirects = false" in p
          print("Physical owner pairing: OK")
          PY
      - name: Real independent ONNX CPU contract and TTXREF01 evidence
        run: |
          # CI-only original arithmetic fixture; no xADAS/private model weights.
          python3 -m venv "$RUNNER_TEMP/ttx-onnx-fixture-venv"
          . "$RUNNER_TEMP/ttx-onnx-fixture-venv/bin/activate"
          python -m pip install --disable-pip-version-check --quiet \
            numpy==2.3.3 onnx==1.19.1 onnxruntime==1.23.2
          python tools/onnx_cpu_contract_fixture.py \
            --output-dir .ci-evidence/onnx-contract
          test -s .ci-evidence/onnx-contract/TTX-original-contract.onnx
          test -s .ci-evidence/onnx-contract/TTX-original-contract.ttxref
          # Independent replay of a TTXREF01 produced from actual input/
          # output bytes. This sample is an original synthetic contract only.
          python tools/verify_device_onnx_reference.py \
            --model .ci-evidence/onnx-contract/TTX-original-contract.onnx \
            --reference .ci-evidence/onnx-contract/TTX-original-contract.ttxref \
            --report .ci-evidence/onnx-contract/independent_cpu_parity.json
          python - <<'PY'
          import subprocess,struct,sys,tempfile
          from pathlib import Path
          ref=Path(".ci-evidence/onnx-contract/TTX-original-contract.ttxref")
          model=Path(".ci-evidence/onnx-contract/TTX-original-contract.onnx")
          with tempfile.TemporaryDirectory() as folder:
              target=Path(folder)/"tampered.ttxref"
              data=bytearray(ref.read_bytes())
              # Device-generated reference with a modified output MUST NOT
              # get a false parity PASS from the same independent CPU model.
              data[-4:]=struct.pack(">f",999999.0)
              target.write_bytes(data)
              command=[sys.executable,"tools/verify_device_onnx_reference.py",
                       "--model",str(model),"--reference",str(target)]
              bad=subprocess.run(command,capture_output=True,text=True)
              assert bad.returncode==2, (bad.returncode,bad.stdout,bad.stderr)
              # A bad model SHA must be rejected BEFORE any inference.
              data=bytearray(ref.read_bytes())
              data[8]^=1
              target.write_bytes(data)
              bad=subprocess.run(command,capture_output=True,text=True)
              assert bad.returncode==1, (bad.returncode,bad.stdout,bad.stderr)
          print("Independent CPU parity negative controls: PASS")
          PY
      - name: Upload original ONNX contract fixture for Android AI audit
        uses: actions/upload-artifact@v4
        with:
          name: TTX-ONNX-CPU-Contract-Reference
          path: .ci-evidence/onnx-contract/
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
      - name: Unit test and build both variants
        run: >-
          gradle --no-daemon
          :app:testLiteDebugUnitTest
          :app:testAiDebugUnitTest
          :app:assembleLiteDebug
          :app:assembleAiDebug
          --stacktrace
      - name: Inspect APK sizes and native architecture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          ijk={"libijkplayer.so","libijkwdzffmpeg.so","libijksdl.so"}
          for flavor in ("lite","ai"):
              files=list(Path(f"app/build/outputs/apk/{flavor}/debug").glob("*.apk"))
              assert len(files)==1, (flavor,files)
              apk=files[0]
              with zipfile.ZipFile(apk) as z:
                  names=z.namelist()
                  libs=[p for p in names if p.endswith(".so")]
                  assert not any(p.lower().endswith((".onnx",".ncnn",".param")) for p in names), (
                      flavor,"no proprietary model weights may be bundled")
              found={p.rsplit("/",1)[-1] for p in libs}
              missing=ijk-found
              assert not missing, (flavor, missing)
              assert all(p.startswith("lib/arm64-v8a/") for p in libs), (flavor,libs)
              if flavor=="lite":
                  assert not any("onnxruntime" in p.lower() for p in libs), libs
              else:
                  assert any("onnxruntime" in p.lower() for p in libs), libs
              print(flavor.upper(),"APK_BYTES",apk.stat().st_size)
              print(flavor.upper(),"NATIVE",sorted(found))
          PY
      - name: Upload compact Lite ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TTX-CameraAI-Lite-ARM64
          path: app/build/outputs/apk/lite/debug/*.apk
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
      - name: Upload ONNX AI ZIP
        uses: actions/upload-artifact@v4
        with:
          name: TTX-CameraAI-AI-ARM64
          path: app/build/outputs/apk/ai/debug/*.apk
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
